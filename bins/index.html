<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#064e6f" />
    <title>Laundry Service | The Wash Company</title>
    <link rel="icon" type="image/png" href="../img/lakeside-laundromat-favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260716-3" />
  </head>
  <body>
    <main class="app-shell">
      <section class="bin-card" aria-labelledby="service-label">
        <div class="logo-frame">
          <img class="logo" src="../img/the-wash-company-logo.png" alt="The Wash Company" />
        </div>
        <p class="eyebrow" id="service-label"><span class="location-label"></span><span class="service-name">Laundry Service</span></p>

        <form id="bin-form" hidden>
          <fieldset class="action-list">
            <legend class="sr-only">Choose a bin update</legend>
            <label class="action-option action-ready">
              <input type="radio" name="action" value="ready" required />
              <span class="action-icon" aria-hidden="true">🧺</span>
              <span><strong>Dirty laundry is ready for pickup</strong><small>(Client use only)</small></span>
            </label>
            <label class="action-option action-picked-up">
              <input type="radio" name="action" value="picked_up" required />
              <span class="action-icon" aria-hidden="true">🚐</span>
              <span><strong>Dirty laundry has been picked up</strong><small>(The Wash Company use only)</small></span>
            </label>
            <label class="action-option action-clean">
              <input type="radio" name="action" value="clean_delivered" required />
              <span class="action-icon" aria-hidden="true">✨</span>
              <span><strong>Clean laundry dropped off</strong><small>(The Wash Company use only)</small></span>
            </label>
          </fieldset>

          <fieldset class="bin-count-field">
            <legend>Number of bins</legend>
            <div class="bin-count-options">
              <label><input type="radio" name="binCount" value="1" required /><span>1</span></label>
              <label><input type="radio" name="binCount" value="2" /><span>2</span></label>
              <label><input type="radio" name="binCount" value="3" /><span>3</span></label>
              <label><input type="radio" name="binCount" value="4" /><span>4</span></label>
              <label><input type="radio" name="binCount" value="5" /><span>5</span></label>
            </div>
          </fieldset>
          <button class="submit-button" type="submit">Send bin update</button>
        </form>

        <div class="status" id="status" role="status" aria-live="polite"></div>
      </section>
    </main>
    <script src="script.js?v=20260716-3"></script>
  </body>
</html>
