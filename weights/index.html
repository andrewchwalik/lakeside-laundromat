<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#064e6f" />
    <title>Laundry Weight Entry | The Wash Company</title>
    <link rel="icon" type="image/png" href="../img/lakeside-laundromat-favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260901-1" />
  </head>
  <body>
    <main class="app-shell">
      <section class="entry-card" aria-labelledby="page-title">
        <div class="logo-frame">
          <img class="logo" src="../img/the-wash-company-logo.png" alt="The Wash Company" />
        </div>

        <p class="eyebrow">Laundry weight entry</p>
        <h1 id="page-title" class="client-name">Loading…</h1>

        <form id="weight-form" hidden>
          <fieldset class="bin-color-field" id="bin-color-field" hidden>
            <legend>Bin color</legend>
            <div class="bin-color-options">
              <label>
                <input type="radio" name="binColor" value="Green" />
                <span class="green-bin">Green <small>37 lb bin</small></span>
              </label>
              <label>
                <input type="radio" name="binColor" value="Blue" />
                <span class="blue-bin">Blue <small>66 lb bin</small></span>
              </label>
            </div>
          </fieldset>

          <label class="weight-field">
            <span id="weight-label">Laundry weight</span>
            <span class="weight-input-wrap">
              <input
                id="weight"
                name="weight"
                type="number"
                min="0.1"
                max="2000"
                step="0.1"
                inputmode="decimal"
                autocomplete="off"
                required
              />
              <span class="unit">lb</span>
            </span>
            <small id="weight-help">Enter the weight shown on the scale.</small>
          </label>

          <div class="preview" id="preview" hidden>
            <div><span>Laundry weight</span><strong id="laundry-preview">—</strong></div>
            <div><span>Charge</span><strong id="charge-preview">—</strong></div>
          </div>

          <button class="submit-button" type="submit">Save weight</button>
        </form>

        <div class="status" id="status" role="status" aria-live="polite"></div>
      </section>
    </main>
    <script src="script.js?v=20260901-1"></script>
  </body>
</html>
